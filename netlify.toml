[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Send unknown paths to the React app so BrowserRouter URLs (/projects, /history)
# work on a direct visit. Real files, including the portfolio2019/2020/2021
# archives, are served as-is because this rule isn't forced.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
